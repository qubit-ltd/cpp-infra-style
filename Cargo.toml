[package]
name = "qubit-cpp-infra-style"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
description = "Deterministic C++ formatting and mechanical style gates"
repository = "https://github.com/qubit-ltd/cpp-infra-style"
include = ["src/**", "build.rs", "conf/**", "assets/**", "schemas/**", "Cargo.toml", "Cargo.lock", "LICENSE", "README.md", "README.zh-CN.md", "rust-toolchain.toml"]
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
readme = "README.md"

[[bin]]
name = "cpp-infra-style"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
globset = "0.4"
sha2 = "0.10"
thiserror = "2"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
similar = "2"
wait-timeout = "0.2"
ctrlc = "3"
libc = "0.2"
same-file = "1"

